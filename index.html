<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Oathfall</title>
  <style>
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    main {
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: 1.5rem;
      color: #94a3b8;
      margin: 0 0 1.5rem;
      font-weight: normal;
    }
    #score {
      font-size: 4rem;
      font-weight: bold;
      margin: 0 0 2rem;
    }
    button {
      font-size: 1.25rem;
      padding: 0.75rem 2.5rem;
      border: none;
      border-radius: 0.5rem;
      background: #6366f1;
      color: white;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    button:hover {
      background: #4f46e5;
    }
    button:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>
  <main>
    <h1>Score</h1>
    <div id="score">0</div>
    <button id="hello-btn">Hello</button>
  </main>
  <script>
    let score = 0;
    const scoreEl = document.getElementById('score');
    document.getElementById('hello-btn').addEventListener('click', () => {
      score += 1;
      scoreEl.textContent = score;
    });
  </script>
</body>
</html>
