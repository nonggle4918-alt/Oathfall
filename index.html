<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OATHFALL — 로컬 프로토타입</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header id="app-header">
      <h1>OATHFALL <span class="subtitle">다크 판타지 디플로메시 — M1 로컬 프로토 (왕국 vs 왕국)</span></h1>
      <div id="round-info">라운드 1 / 12</div>
      <button id="new-game-btn" class="btn btn-ghost">새 게임</button>
    </header>

    <div id="resource-bar"></div>

    <main id="main-layout">
      <div id="map-panel">
        <svg id="map"></svg>
      </div>
      <aside id="side-panel">
        <section id="order-section">
          <h2>병력 명령</h2>
          <div id="order-panel"></div>
        </section>
        <section id="hand-section">
          <h2>손패</h2>
          <div id="hand"></div>
        </section>
        <button id="end-turn-btn" class="btn btn-primary">턴 종료</button>
        <section id="log-section">
          <h2>진행 기록</h2>
          <div id="log"></div>
        </section>
      </aside>
    </main>

    <div id="victory-overlay" class="hidden"></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
